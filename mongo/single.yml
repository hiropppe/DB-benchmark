version: '3'
services:
    mongos:
        image: mongo:4.0.0-xenial
        container_name: mongos
        command: ["mongos", "-f", "/etc/mongos.conf"]
        ports:
            - "27017:27017"
        volumes:
            - ./etc/mongos.conf:/etc/mongos.conf
    mongod_rs0:
        image: mongo:4.0.0-xenial
        container_name: mongod_rs0
        command: ["mongod", "-f", "/etc/mongod_rs0.conf"]
        ports:
            - "27018:27018"
        volumes:
            - ./etc/mongod_rs0.conf:/etc/mongod_rs0.conf
    mongod_rs1:
        image: mongo:4.0.0-xenial
        container_name: mongod_rs1
        command: ["mongod", "-f", "/etc/mongod_rs1.conf"]
        ports:
            - "27028:27018"
        volumes:
            - ./etc/mongod_rs1.conf:/etc/mongod_rs1.conf
    mongoc:
        image: mongo:4.0.0-xenial
        container_name: mongoc
        command: ["mongod", "-f", "/etc/mongoc.conf"]
        ports:
            - "27019:27019"
        volumes:
            - ./etc/mongoc.conf:/etc/mongoc.conf
